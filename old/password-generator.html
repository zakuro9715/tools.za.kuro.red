<!DOCTYPE html>
<html lang="ja">
<head>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'media',
      theme: {
        extend: {

  </script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>

  <style>
    /* Range Slider Styling */
    input[type=range] {
      accent-color: #0284c7;
    }
    /* Monospace for password display */
    .font-mono-pw {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

</head>
<body class="bg-gray-50 dark:bg-zinc-900 text-gray-800 dark:text-zinc-100 min-h-screen flex flex-col font-sans transition-colors duration-150">
  <div id="app" class="flex flex-col min-h-screen">

    <!-- Header -->
    <header class="border-b border-gray-200 dark:border-zinc-800 bg-white dark:bg-zinc-950 px-4 py-3 sticky top-0 z-10">
      <div class="max-w-4xl mx-auto flex items-center justify-between">
        <!-- Left Section -->
        <div class="flex items-center space-x-2 text-sm sm:text-base font-medium">
          <a href="/" class="flex items-center space-x-1.5 text-gray-700 dark:text-zinc-300 hover:text-black dark:hover:text-white transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
            </svg>
            <span>Tools</span>
          </a>
          <span class="text-gray-300 dark:text-zinc-700">|</span>
          <span class="text-gray-900 dark:text-zinc-100 font-semibold">パスワード生成器</span>
        </div>

        <!-- Right Section -->
        <div class="flex items-center space-x-3">
          <a href="https://x.com/zakuro9715" target="_blank" rel="noopener noreferrer" class="text-gray-500 hover:text-gray-900 dark:text-zinc-400 dark:hover:text-white transition" title="X (Twitter)">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
              <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
            </svg>
          </a>
          <a href="https://github.com/zakuro9715/tools.za.kuro.red" target="_blank" rel="noopener noreferrer" class="text-gray-500 hover:text-gray-900 dark:text-zinc-400 dark:hover:text-white transition" title="GitHub">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
            </svg>
          </a>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-8 space-y-8">

      <!-- Preset Selector -->
      <section class="space-y-2">
        <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-zinc-400">プリセット</label>
        <div class="flex flex-wrap gap-2">
          <button 
            @click="applyBuiltinPreset('strong')" 
            :class="activePreset === 'strong' ? 'bg-gray-900 text-white dark:bg-zinc-100 dark:text-zinc-900 border-transparent' : 'bg-white dark:bg-zinc-800 text-gray-700 dark:text-zinc-300 border-gray-300 dark:border-zinc-700 hover:bg-gray-100 dark:hover:bg-zinc-700'"
            class="px-4 py-2 rounded-lg text-sm font-medium border transition shadow-sm">
            Strong (32文字・全文字種)
          </button>
          <button 
            @click="applyBuiltinPreset('simple')" 
            :class="activePreset === 'simple' ? 'bg-gray-900 text-white dark:bg-zinc-100 dark:text-zinc-900 border-transparent' : 'bg-white dark:bg-zinc-800 text-gray-700 dark:text-zinc-300 border-gray-300 dark:border-zinc-700 hover:bg-gray-100 dark:hover:bg-zinc-700'"
            class="px-4 py-2 rounded-lg text-sm font-medium border transition shadow-sm">
            Simple (12文字・記号なし)
          </button>

          <!-- Custom Presets -->
          <button 
            v-for="p in customPresets" 
            :key="p.name"
            @click="applyCustomPreset(p)"
            :class="activePreset === p.name ? 'bg-gray-900 text-white dark:bg-zinc-100 dark:text-zinc-900 border-transparent' : 'bg-white dark:bg-zinc-800 text-gray-700 dark:text-zinc-300 border-gray-300 dark:border-zinc-700 hover:bg-gray-100 dark:hover:bg-zinc-700'"
            class="px-4 py-2 rounded-lg text-sm font-medium border transition shadow-sm flex items-center space-x-2">
            <span>{{ p.name }}</span>
            <span @click.stop="deleteCustomPreset(p.name)" class="text-xs opacity-60 hover:opacity-100 hover:text-red-500 px-1">✕</span>
          </button>
        </div>
      </section>

      <!-- Password Result Display -->
      <section class="bg-white dark:bg-zinc-950 border border-gray-200 dark:border-zinc-800 rounded-xl p-4 sm:p-6 shadow-sm space-y-4">
        <div class="relative flex items-center">
          <input 
            type="text" 
            readonly 
            :value="generatedPassword" 
            class="w-full bg-gray-50 dark:bg-zinc-900 text-gray-900 dark:text-zinc-100 font-mono-pw text-lg sm:text-2xl p-4 pr-24 rounded-lg border border-gray-200 dark:border-zinc-800 focus:outline-none break-all"
            placeholder="パスワードがここに表示されます"
          >
          <div class="absolute right-2 flex items-center space-x-1">
            <!-- Regenerate Button -->
            <button 
              @click="generatePassword" 
              title="再生成"
              class="p-2 text-gray-600 dark:text-zinc-400 hover:text-gray-900 dark:hover:text-white hover:bg-gray-200 dark:hover:bg-zinc-800 rounded-lg transition">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
              </svg>
            </button>

            <!-- Copy Button -->
            <button 
              @click="copyToClipboard" 
              title="コピー"
              class="p-2 text-gray-600 dark:text-zinc-400 hover:text-gray-900 dark:hover:text-white hover:bg-gray-200 dark:hover:bg-zinc-800 rounded-lg transition">
              <svg v-if="!copied" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
              </svg>
              <svg v-else class="w-6 h-6 text-green-600 dark:text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Copy Notification Toast/Text -->
        <div v-if="copied" class="text-xs text-green-600 dark:text-green-400 font-medium text-right">
          クリップボードにコピーしました！
        </div>
      </section>

      <!-- Parameters Input Section -->
      <section class="bg-white dark:bg-zinc-950 border border-gray-200 dark:border-zinc-800 rounded-xl p-5 sm:p-6 shadow-sm space-y-6">
        <h2 class="text-base font-semibold border-b border-gray-100 dark:border-zinc-800 pb-3">パラメータ設定</h2>

        <!-- Character Sets -->
        <div class="space-y-3">
          <label class="block text-sm font-medium text-gray-700 dark:text-zinc-300">文字セット</label>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <label class="flex items-center space-x-2.5 p-3 rounded-lg border border-gray-200 dark:border-zinc-800 hover:bg-gray-50 dark:hover:bg-zinc-900 cursor-pointer transition">
              <input type="checkbox" v-model="charSets.numbers" class="rounded border-gray-300 dark:border-zinc-700 text-brand-600 focus:ring-0 w-4 h-4">
              <span class="text-sm">数字 (0-9)</span>
            </label>
            <label class="flex items-center space-x-2.5 p-3 rounded-lg border border-gray-200 dark:border-zinc-800 hover:bg-gray-50 dark:hover:bg-zinc-900 cursor-pointer transition">
              <input type="checkbox" v-model="charSets.letters" class="rounded border-gray-300 dark:border-zinc-700 text-brand-600 focus:ring-0 w-4 h-4">
              <span class="text-sm">アルファベット (a-z, A-Z)</span>
            </label>
            <label class="flex items-center space-x-2.5 p-3 rounded-lg border border-gray-200 dark:border-zinc-800 hover:bg-gray-50 dark:hover:bg-zinc-900 cursor-pointer transition">
              <input type="checkbox" v-model="charSets.symbols" class="rounded border-gray-300 dark:border-zinc-700 text-brand-600 focus:ring-0 w-4 h-4">
              <span class="text-sm">記号 (-_!@#$%)</span>
            </label>
          </div>
        </div>

        <!-- Options -->
        <div class="space-y-3">
          <label class="block text-sm font-medium text-gray-700 dark:text-zinc-300">文字セットオプション</label>
          <label class="flex items-center space-x-2.5 p-3 rounded-lg border border-gray-200 dark:border-zinc-800 hover:bg-gray-50 dark:hover:bg-zinc-900 cursor-pointer transition">
            <input type="checkbox" v-model="requireAllTypes" class="rounded border-gray-300 dark:border-zinc-700 text-brand-600 focus:ring-0 w-4 h-4">
            <span class="text-sm">選択文字種を必ず含める</span>
          </label>
        </div>

        <!-- Custom Extra Characters -->
        <div class="space-y-3">
          <label class="block text-sm font-medium text-gray-700 dark:text-zinc-300">追加のカスタム文字</label>
          <input 
            type="text" 
            v-model="customChars" 
            placeholder="例: &*+?= (含めたい特定の文字を入力)" 
            class="w-full px-3 py-2 rounded-lg border border-gray-200 dark:border-zinc-800 bg-gray-50 dark:bg-zinc-900 text-sm focus:outline-none focus:border-brand-500 dark:focus:border-brand-500"
          >
        </div>

        <!-- Length Selection -->
        <div class="space-y-3">
          <div class="flex justify-between items-center">
            <label class="text-sm font-medium text-gray-700 dark:text-zinc-300">長さ</label>
            <span class="text-sm font-mono-pw font-bold px-2.5 py-0.5 bg-gray-100 dark:bg-zinc-800 rounded">{{ length }} 文字</span>
          </div>

          <!-- Quick Selector Buttons -->
          <div class="flex flex-wrap gap-2">
            <button 
              v-for="l in [8, 12, 16, 32, 64]" 
              :key="l" 
              @click="length = l" 
              :class="length === l ? 'bg-gray-800 text-white dark:bg-zinc-200 dark:text-zinc-900' : 'bg-gray-100 text-gray-700 dark:bg-zinc-800 dark:text-zinc-300 hover:bg-gray-200 dark:hover:bg-zinc-700'"
              class="px-3 py-1.5 rounded text-xs font-semibold transition">
              {{ l }}
            </button>
          </div>

          <!-- Slider -->
          <input 
            type="range" 
            min="4" 
            max="64" 
            v-model.number="length" 
            class="w-full h-2 bg-gray-200 dark:bg-zinc-800 rounded-lg appearance-none cursor-pointer"
          >
        </div>
      </section>

      <!-- Save as Custom Preset -->
      <section class="bg-white dark:bg-zinc-950 border border-gray-200 dark:border-zinc-800 rounded-xl p-5 sm:p-6 shadow-sm space-y-4">
        <h2 class="text-base font-semibold">プリセットに保存</h2>
        <form @submit.prevent="savePreset" class="flex flex-col sm:flex-row gap-3">
          <input 
            type="text" 
            v-model="newPresetName" 
            placeholder="プリセット名を入力..." 
            class="flex-grow px-4 py-2 rounded-lg border border-gray-200 dark:border-zinc-800 bg-gray-50 dark:bg-zinc-900 text-sm focus:outline-none focus:border-brand-500 dark:focus:border-brand-500"
            required
          >
          <button 
            type="submit" 
            class="px-5 py-2 bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium rounded-lg transition shadow-sm whitespace-nowrap">
            保存する
          </button>
        </form>
      </section>

    </main>

    <!-- Footer -->
    <footer class="border-t border-gray-200 dark:border-zinc-800 bg-white dark:bg-zinc-950 py-4 mt-auto">
      <div class="max-w-4xl mx-auto px-4 text-center text-xs text-gray-500 dark:text-zinc-500">
        &copy; 2026 zakuro. All rights reserved.
      </div>
    </footer>

  </div>

  <script>
    const { createApp, ref, reactive, watch, onMounted } = Vue;

    createApp({
      setup() {
        // App State
        const generatedPassword = ref('');
        const length = ref(32);
        const activePreset = ref('strong');
        const copied = ref(false);
        const newPresetName = ref('');
        const customChars = ref('');

        const charSets = reactive({
          numbers: true,
          letters: true,
          symbols: true
        });

        const requireAllTypes = ref(true);
        const customPresets = ref([]);

        // Character pool definitions
        const NUMBERS = '0123456789';
        const LOWERCASE = 'abcdefghijklmnopqrstuvwxyz';
        const UPPERCASE = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const SYMBOLS = '-_!@#$%';

        // Local Storage Key
        const STORAGE_KEY = 'zakuro_pw_generator_custom_presets';

        // Secure Random Helper
        const getRandomInt = (max) => {
          const array = new Uint32Array(1);
          window.crypto.getRandomValues(array);
          return array[0] % max;
        };

        // Main Password Generation Logic
        const generatePassword = () => {
          let pool = '';
          const requiredChars = [];

          if (charSets.numbers) {
            pool += NUMBERS;
            if (requireAllTypes.value) requiredChars.push(NUMBERS[getRandomInt(NUMBERS.length)]);
          }
          if (charSets.letters) {
            pool += LOWERCASE + UPPERCASE;
            if (requireAllTypes.value) {
              requiredChars.push(LOWERCASE[getRandomInt(LOWERCASE.length)]);
              requiredChars.push(UPPERCASE[getRandomInt(UPPERCASE.length)]);
            }
          }
          if (charSets.symbols) {
            pool += SYMBOLS;
            if (requireAllTypes.value) requiredChars.push(SYMBOLS[getRandomInt(SYMBOLS.length)]);
          }
          if (customChars.value) {
            pool += customChars.value;
            if (requireAllTypes.value) requiredChars.push(customChars.value[getRandomInt(customChars.value.length)]);
          }

          // Fallback if no sets selected
          if (!pool) {
            generatedPassword.value = '';
            return;
          }

          let result = [];
          
          // Add guaranteed characters if enabled
          if (requireAllTypes.value && requiredChars.length <= length.value) {
            result.push(...requiredChars);
          }

          // Fill the rest randomly
          while (result.length < length.value) {
            result.push(pool[getRandomInt(pool.length)]);
          }

          // Shuffle result using Fisher-Yates
          for (let i = result.length - 1; i > 0; i--) {
            const j = getRandomInt(i + 1);
            [result[i], result[j]] = [result[j], result[i]];
          }

          generatedPassword.value = result.join('');
        };

        // Presets Logic
        const applyBuiltinPreset = (type) => {
          activePreset.value = type;
          customChars.value = '';
          if (type === 'strong') {
            length.value = 32;
            charSets.numbers = true;
            charSets.letters = true;
            charSets.symbols = true;
            requireAllTypes.value = true;
          } else if (type === 'simple') {
            length.value = 12;
            charSets.numbers = true;
            charSets.letters = true;
            charSets.symbols = false;
            requireAllTypes.value = false;
          }
        };

        const applyCustomPreset = (preset) => {
          activePreset.value = preset.name;
          length.value = preset.length;
          charSets.numbers = preset.charSets.numbers;
          charSets.letters = preset.charSets.letters;
          charSets.symbols = preset.charSets.symbols;
          requireAllTypes.value = preset.requireAllTypes;
          customChars.value = preset.customChars || '';
        };

        const savePreset = () => {
          if (!newPresetName.value.trim()) return;

          const preset = {
            name: newPresetName.value.trim(),
            length: length.value,
            charSets: { ...charSets },
            requireAllTypes: requireAllTypes.value,
            customChars: customChars.value
          };

          // Remove existing with same name if present
          customPresets.value = customPresets.value.filter(p => p.name !== preset.name);
          customPresets.value.push(preset);
          
          localStorage.setItem(STORAGE_KEY, JSON.stringify(customPresets.value));
          activePreset.value = preset.name;
          newPresetName.value = '';
        };

        const deleteCustomPreset = (name) => {
          customPresets.value = customPresets.value.filter(p => p.name !== name);
          localStorage.setItem(STORAGE_KEY, JSON.stringify(customPresets.value));
          if (activePreset.value === name) {
            activePreset.value = 'custom';
          }
        };

        const loadCustomPresets = () => {
          try {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
              customPresets.value = JSON.parse(saved);
            }
          } catch (e) {
            console.error('Failed to load custom presets from localStorage', e);
          }
        };

        // Clipboard Copy
        const copyToClipboard = () => {
          if (!generatedPassword.value) return;

          // Fallback + standard API support
          if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(generatedPassword.value);
          } else {
            const textArea = document.createElement("textarea");
            textArea.value = generatedPassword.value;
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
              document.execCommand('copy');
            } catch (err) {
              console.error('Fallback copy failed', err);
            }
            document.body.removeChild(textArea);
          }

          copied.value = true;
          setTimeout(() => {
            copied.value = false;
          }, 2000);
        };

        // Reactive triggers on settings change
        watch([length, charSets, requireAllTypes, customChars], () => {
          generatePassword();
        }, { deep: true });

        // Initialize on mount
        onMounted(() => {
          loadCustomPresets();
          applyBuiltinPreset('strong');
          generatePassword();
        });

        return {
          generatedPassword,
          length,
          activePreset,
          copied,
          newPresetName,
          customChars,
          charSets,
          requireAllTypes,
          customPresets,
          generatePassword,
          applyBuiltinPreset,
          applyCustomPreset,
          savePreset,
          deleteCustomPreset,
          copyToClipboard
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
