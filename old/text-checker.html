        <!-- Main Content -->

            <!-- Editor Section -->

                    <textarea

                        <div class="flex items-center space-x-3">

                            >

                                <span>{{ showDiffHighlight ? '標準表示' : 'ハイライト' }}</span>
                            </button>
                            <button 
                                v-if="resultText" 
                                @click="copyResult"

                                <span>チェック中...</span>
                            </div>
                        </template>
                        <template v-else-if="resultText">
                            <template v-if="showDiffHighlight && correctedDiffChunks.length > 0">
                                <template v-for="(chunk, idx) in correctedDiffChunks" :key="idx">
                                    <mark v-if="chunk.isMarked" class="bg-emerald-100 text-emerald-800 dark:bg-emerald-900/50 dark:text-emerald-200 font-semibold rounded px-0.5 py-0.2 mx-0.5">{{ chunk.text }}</mark>
                                    <span v-else>{{ chunk.text }}</span>
                                </template>
                            </template>
                            <template v-else>
                                {{ resultText }}
                            </template>
                        </template>
                        <template v-else>
                            <span class="text-gray-400">チェック結果がここに表示されます</span>
                        </template>
                    </div>
                </div>
            </div>

            <!-- Action Button -->

            <!-- Error Notification -->

            <!-- Issues List -->
            <div v-if="issues && issues.length > 0" class="border border-gray-200 dark:border-gray-800 rounded-lg bg-white dark:bg-gray-800 overflow-hidden">
                <div class="px-4 py-2.5 border-b border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800/50 text-xs font-semibold text-gray-600 dark:text-gray-300 flex items-center justify-between">
                    <span>指摘箇所 ({{ issues.length }}件)</span>
                </div>
                <div class="divide-y divide-gray-100 dark:divide-gray-700/50">
                    <div v-for="(issue, index) in issues" :key="index" class="p-3 text-xs flex flex-col md:flex-row md:items-center justify-between gap-2">
                        <div class="flex items-start space-x-2">

                                  :class="getTypeClass(issue.type)">

                            </span>
                            <div>
                                <div class="font-medium text-gray-800 dark:text-gray-200">
                                    <span class="line-through text-red-500 mr-1.5">{{ issue.original }}</span>
                                    <i class="fa-solid fa-arrow-right text-[10px] text-gray-400 mr-1.5"></i>
                                    <span class="text-emerald-600 dark:text-emerald-400 font-semibold">{{ issue.suggestion }}</span>
                                </div>
                                <div class="text-gray-500 dark:text-gray-400 mt-0.5">
                                    {{ issue.reason }}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div v-else-if="hasChecked && issues.length === 0" class="p-4 border border-emerald-200 dark:border-emerald-900/50 bg-emerald-50/50 dark:bg-emerald-950/20 rounded-lg text-center text-xs text-emerald-700 dark:text-emerald-400">
                <i class="fa-solid fa-circle-check mr-1"></i> 誤字脱字・修正が必要な箇所は見つかりませんでした。
            </div>

        </main>

        <!-- Footer -->
        <footer class="border-t border-gray-200 dark:border-gray-800 py-4 text-center text-xs text-gray-500 dark:text-gray-400">
            &copy; 2026 zakuro. All rights reserved.

    <script>
        const { createApp, ref, onMounted, watch } = Vue;

        const DEFAULT_SYSTEM_PROMPT = "あなたは日本語の文章校正の専門家です。与えられた文章の誤字、脱字、不自然な文法、不適切な表現を分析・修正してください。";

        createApp({
            setup() {
                const inputText = ref('');
                const resultText = ref('');
                const issues = ref([]);
                const loading = ref(false);
                const hasChecked = ref(false);
                const errorMessage = ref('');
						const apiKey = ref(localStorage.getItem('gemini_api_key') || '');
                const copied = ref(false);
                const isDark = ref(false);
                const showPromptSettings = ref(false);
                const showDiffHighlight = ref(true);

						const modelOptions = [
							{ label: 'Gemini 3.7 Flash', value: 'gemini-3.7-flash' },
							{ label: 'Gemini 3.6 Flash', value: 'gemini-3.6-flash' },
							{ label: 'Gemini 3.5 Flash', value: 'gemini-3.5-flash' },
							{ label: 'Gemini 3.5 Flash Lite', value: 'gemini-3.5-flash-lite' },
							{ label: 'Gemini 3.1 Flash Lite', value: 'gemini-3.1-flash-lite' },
							{ label: 'Gemma 4 31B', value: 'gemma-4-31b-it' }
						];
						const selectedModel = ref(localStorage.getItem('text_checker_model') || 'gemini-3.5-flash-lite');

                const correctedDiffChunks = ref([]);

                const systemPrompt = ref(localStorage.getItem('text_checker_prompt') || DEFAULT_SYSTEM_PROMPT);

                watch(systemPrompt, (newVal) => {
                    localStorage.setItem('text_checker_prompt', newVal);
                });

						watch(apiKey, (newVal) => {
							localStorage.setItem('gemini_api_key', newVal);
						});

						watch(selectedModel, (newVal) => {
							localStorage.setItem('text_checker_model', newVal);
						});

                const resetPrompt = () => {
                    systemPrompt.value = DEFAULT_SYSTEM_PROMPT;
                    localStorage.removeItem('text_checker_prompt');
                };

                const clearInput = () => {
                    inputText.value = '';
                    resultText.value = '';
                    hasChecked.value = false;
                    correctedDiffChunks.value = [];
                };

                onMounted(() => {
                    isDark.value = document.documentElement.classList.contains('dark');
                });

                const toggleDarkMode = () => {
                    isDark.value = !isDark.value;
                    if (isDark.value) {
                        document.documentElement.classList.add('dark');
                    } else {
                        document.documentElement.classList.remove('dark');
                    }
                };

                const getTypeClass = (type) => {
                    switch (type) {
                        case '誤字':
                        case '脱字':
                            return 'bg-red-100 text-red-700 dark:bg-red-900/40 dark:text-red-300';
                        case '文法':
                            return 'bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-300';
                        case '表現':
                        default:
                            return 'bg-blue-100 text-blue-700 dark:bg-blue-900/40 dark:text-blue-300';
                    }
                };

                // Diff Algorithm (LCS Based)
                const computeDiff = (oldStr, newStr) => {
                    const s1 = Array.from(oldStr);
                    const s2 = Array.from(newStr);
                    const len1 = s1.length;
                    const len2 = s2.length;

                    // LCS DP Table
                    const dp = Array.from({ length: len1 + 1 }, () => new Int32Array(len2 + 1));
                    for (let i = 0; i < len1; i++) {
                        for (let j = 0; j < len2; j++) {
                            if (s1[i] === s2[j]) {
                                dp[i + 1][j + 1] = dp[i][j] + 1;
                            } else {
                                dp[i + 1][j + 1] = Math.max(dp[i + 1][j], dp[i][j + 1]);
                            }
                        }
                    }

                    let i = len1, j = len2;
                    const newDiff = [];

                    while (i > 0 || j > 0) {
                        if (i > 0 && j > 0 && s1[i - 1] === s2[j - 1]) {
                            newDiff.unshift({ char: s2[j - 1], type: 'same' });
                            i--; j--;
                        } else if (j > 0 && (i === 0 || dp[i][j - 1] >= dp[i - 1][j])) {
                            newDiff.unshift({ char: s2[j - 1], type: 'added' });
                            j--;
                        } else if (i > 0 && (j === 0 || dp[i][j - 1] < dp[i - 1][j])) {
                            i--;
                        }
                    }

                    const groupChunks = (diffArray) => {
                        const result = [];
                        let currentChunk = { text: '', isMarked: false };

                        for (const item of diffArray) {
                            const isMarked = item.type === 'added';
                            if (currentChunk.text === '') {
                                currentChunk.text = item.char;
                                currentChunk.isMarked = isMarked;
                            } else if (currentChunk.isMarked === isMarked) {
                                currentChunk.text += item.char;
                            } else {
                                result.push(currentChunk);
                                currentChunk = { text: item.char, isMarked: isMarked };
                            }
                        }
                        if (currentChunk.text !== '') {
                            result.push(currentChunk);
                        }
                        return result;
                    };

                    correctedDiffChunks.value = groupChunks(newDiff);
                };

                const checkText = async () => {
                    if (!inputText.value.trim()) return;

									if (!apiKey.value.trim()) {
										errorMessage.value = 'APIキーが入力されていません。Gemini APIキーを入力してください。';
										return;
									}

                    loading.value = true;
                    errorMessage.value = '';
                    hasChecked.value = false;
                    issues.value = [];
                    resultText.value = '';

                    const userPrompt = `以下の文章を校正してください:\n\n${inputText.value}`;

                    const payload = {
                        contents: [{ parts: [{ text: userPrompt }] }],
                        systemInstruction: {
                            parts: [{ text: systemPrompt.value }]
                        },
                        generationConfig: {
                            responseMimeType: "application/json",
                            responseSchema: {
                                type: "OBJECT",
                                properties: {
                                    correctedText: { 
                                        type: "STRING", 
                                        description: "校正・修正後の全体文章" 
                                    },
                                    issues: {
                                        type: "ARRAY",
                                        description: "検出された問題のリスト",
                                        items: {
                                            type: "OBJECT",
                                            properties: {
                                                original: { type: "STRING", description: "修正前の該当部分" },
                                                suggestion: { type: "STRING", description: "修正後の該当部分" },
                                                reason: { type: "STRING", description: "修正理由・説明" },
                                                type: { type: "STRING", description: "種別(誤字, 脱字, 文法, 表現)" }
                                            },
                                            required: ["original", "suggestion", "reason", "type"]
                                        }
                                    }
                                },
                                required: ["correctedText", "issues"]
                            }
                        }
                    };

                    // Exponential Backoff API Call Logic
                    const maxRetries = 3;
                    let attempt = 0;
                    let success = false;

                    while (attempt < maxRetries && !success) {
                        try {
													const url = `https://generativelanguage.googleapis.com/v1beta/models/${selectedModel.value}:generateContent?key=${apiKey.value}`;
                            const response = await fetch(url, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(payload)
                            });

                            if (!response.ok) {
															if (response.status === 403) {
																const errData = await response.json().catch(() => ({}));
																const detail = errData.error?.message || 'APIキーが無効、または未設定です。Gemini APIキーを設定してください。';
																throw new Error(`403: ${detail}`);
															}
                                throw new Error(`HTTP Error: ${response.status}`);
                            }

                            const result = await response.json();
                            const candidate = result.candidates?.[0];

                            if (candidate && candidate.content?.parts?.[0]?.text) {
                                const parsedData = JSON.parse(candidate.content.parts[0].text);
                                resultText.value = parsedData.correctedText || '';
                                issues.value = parsedData.issues || [];
                                
                                // Compute visual diff
                                computeDiff(inputText.value, resultText.value);

                                hasChecked.value = true;
                                success = true;
                            } else {
                                throw new Error('応答形式が予期したものと異なります。');
                            }

                        } catch (err) {
													if (err.message && err.message.startsWith('403:')) {
														errorMessage.value = err.message.replace('403: ', '');
														break; // 認証エラーの場合はリトライせずに終了
													}
                            attempt++;
                            if (attempt >= maxRetries) {
															errorMessage.value = '校正中にエラーが発生しました。APIキーやネットワーク接続をご確認の上、時間を置いて再度お試しください。';
                            } else {
                                await new Promise(resolve => setTimeout(resolve, Math.pow(2, attempt - 1) * 1000));
                            }
                        }
                    }

                    loading.value = false;
                };

                const copyResult = () => {
                    if (!resultText.value) return;
                    
                    const textarea = document.createElement('textarea');
                    textarea.value = resultText.value;
                    textarea.style.position = 'fixed';
                    textarea.style.opacity = '0';
                    document.body.appendChild(textarea);
                    textarea.select();
                    
                    try {
                        document.execCommand('copy');
                        copied.value = true;
                        setTimeout(() => {
                            copied.value = false;
                        }, 2000);
                    } catch (err) {
                        errorMessage.value = 'コピーに失敗しました';
                    } finally {
                        document.body.removeChild(textarea);
                    }
                };

                return {
                    inputText,
                    resultText,
                    issues,
                    loading,
                    hasChecked,
                    errorMessage,
                    apiKey,
									modelOptions,
									selectedModel,
                    copied,
                    isDark,
                    showPromptSettings,
                    systemPrompt,
                    showDiffHighlight,
                    correctedDiffChunks,
                    resetPrompt,
                    clearInput,
                    toggleDarkMode,
                    checkText,
                    copyResult,
                    getTypeClass
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
